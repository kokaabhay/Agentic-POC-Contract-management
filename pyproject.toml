[project]
name = "agentic-poc-contract-management"
version = "0.1.0"
description = "An Agentic Proof of Concept for automated contract parsing, review, and compliance analysis using Microsoft Foundry/Azure OpenAI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
# Core application dependencies derived from your requirements.txt
dependencies = [
    "fastapi[standard]",
    "python-multipart",
    "pydantic-settings",
    # --- LLM & Enterprise Authentication ---
    "openai",
    "azure-identity",
    # --- High-Fidelity Document Ingestion ---
    "pymupdf",
    "python-docx",
    "docling",
    # --- Network and Environment Utilities ---
    "httpx",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Linting tool config
[tool.ruff]
line-length = 88
target-version = "py311"

# Testing config ensures 'src' is cleanly discoverable
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.hatch.build.targets.wheel]
packages = ["src/app"]
